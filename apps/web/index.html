<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Match the light and dark background tokens in src/index.css. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent Hub" />
    <!-- Service worker support waits for the later Tailscale HTTPS change;
         the current plain HTTP tailnet origin is not a secure context. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Paint the right background before any script loads: main.tsx sets the dark class only after
         the app's modules arrive, which on a phone left a white frame first. Keep in sync with the
         --background tokens in src/index.css and main.tsx's applyTheme. -->
    <style>
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html { background: #0a0a0a; } }
    </style>
    <script>
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
    </script>
    <title>Agent Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
